<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Entry - BEEC - Brain Talks</title>
    <link rel="stylesheet" href="submit.css">
</head>
<body>
    <div class="container">
        <header class="detail-header">
            <nav class="detail-nav">
                <a href="beec.html" class="back-btn">← Back</a>
                <div class="library-logo">Brain Talks</div>
            </nav>
        </header>

        <div class="form-container">
            <div class="form-header">
                <h1 class="form-title">Submit Entry: BEEC</h1>
                <p class="form-subtitle">Deadline: 30th June 2026, 23:59 UTC</p>
            </div>

            <div class="email-form-wrapper">
                <form class="email-form" id="beecForm">
                    <input type="hidden" name="competition" value="BEEC">
                    <div class="form-group">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" id="name" name="name" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" name="email" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="country" class="form-label">Country</label>
                        <input type="text" id="country" name="country" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="essayTitle" class="form-label">Essay Title</label>
                        <input type="text" id="essayTitle" name="essayTitle" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="link" class="form-label">Link to Essay (Google Drive/Doc)</label>
                        <input type="url" id="link" name="link" class="form-input" required>
                    </div>

                    <button type="submit" class="submit-button">Submit Entry</button>
                </form>
            </div>
        </div>
    </div>
    <footer class="navigation-footer">
        <img src="BT logo.png" alt="Brain Talks Logo"> 
        <br>
        <br>
        <p>&copy; 2026 Brain Talks. All rights reserved.</p>
    </footer>
    <script src="submit.js"></script>
</body>
</html>
